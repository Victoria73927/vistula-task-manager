<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Task Manager</h1>
      <p>Student ID: <span id="student-id">73927</span></p>
    </header>

    <form id="task-form">
      <label for="task-title">Title</label>
      <input type="text" id="task-title" required>
      <label for="task-description">Description</label>
      <input type="text" id="task-description">
      <div class="form-actions">
        <button type="submit" id="task-submit">Add task</button>
        <button type="button" id="task-cancel" hidden>Cancel</button>
      </div>
    </form>

    <p id="status-message" role="status"></p>

    <div id="task-list"></div>

    <footer>
      <a id="contribution-link" href="contribution.html">Team contribution page</a>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
